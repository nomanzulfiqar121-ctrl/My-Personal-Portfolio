<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Noman Zulfiqar — Portfolio</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#0d1b3e;
  --navy-dark:#081029;
  --navy-mid:#112249;
  --sidebar-w:220px;
  --accent:#7c6af5;
  --accent2:#5b4de0;
  --text-main:#e8eaf0;
  --text-muted:#9ba3b8;
  --white:#ffffff;
  --card-bg:#f8f9fc;
  --border:#e2e5ef;
  --body-bg:#f0f2f8;
  --section-bg:#ffffff;
  --dark-text:#1a2340;
  --mid-text:#4a5270;
}
html{scroll-behavior:smooth;}
body{
  font-family:'Poppins',sans-serif;
  background:var(--body-bg);
  display:flex;
  min-height:100vh;
  overflow-x:hidden;
}

/* ── SIDEBAR ── */
.sidebar{
  width:var(--sidebar-w);
  background:var(--navy);
  min-height:100vh;
  position:fixed;
  top:0;left:0;
  display:flex;
  flex-direction:column;
  padding:2rem 0 1.5rem;
  z-index:200;
  box-shadow:4px 0 20px rgba(0,0,0,.25);
}
.sidebar-logo{
  text-align:center;
  padding:0 1.5rem 2rem;
  border-bottom:1px solid rgba(255,255,255,.08);
  margin-bottom:1.5rem;
}
.logo-box{
  width:52px;height:52px;
  background:var(--accent);
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;font-weight:700;color:white;
  margin:0 auto .7rem;
  letter-spacing:.05em;
}
.logo-name{
  color:var(--white);
  font-size:.8rem;
  font-weight:700;
  letter-spacing:.06em;
  line-height:1.4;
  text-transform:uppercase;
}
nav.side-nav{list-style:none;flex:1;}
nav.side-nav li a{
  display:flex;align-items:center;gap:.75rem;
  padding:.7rem 1.6rem;
  color:var(--text-muted);
  text-decoration:none;
  font-size:.82rem;
  font-weight:500;
  transition:all .2s;
  border-left:3px solid transparent;
}
nav.side-nav li a:hover,
nav.side-nav li a.active{
  color:var(--white);
  background:rgba(124,106,245,.15);
  border-left-color:var(--accent);
}
nav.side-nav li a i{width:18px;text-align:center;font-size:.85rem;}
.sidebar-cv{
  margin:1rem 1.5rem 0;
  background:var(--accent);
  color:white;border:none;
  padding:.65rem 1rem;
  border-radius:8px;
  font-family:'Poppins',sans-serif;
  font-size:.78rem;font-weight:600;
  cursor:pointer;width:100%;
  display:flex;align-items:center;justify-content:center;gap:.5rem;
  transition:background .2s;
}
.sidebar-cv:hover{background:var(--accent2);}

/* ── MAIN ── */
.main{
  margin-left:var(--sidebar-w);
  flex:1;
  min-width:0;
}

/* ── HERO ── */
.hero{
  background:linear-gradient(135deg,var(--navy-dark) 0%,var(--navy) 50%,var(--navy-mid) 100%);
  padding:3.5rem 4rem 3rem;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:2rem;
  min-height:420px;
  position:relative;
  overflow:hidden;
}
/* subtle star dots */
.hero::before{
  content:'';
  position:absolute;inset:0;
  background-image:
    radial-gradient(1.5px 1.5px at 15% 20%, rgba(255,255,255,.18) 0%, transparent 100%),
    radial-gradient(1px 1px at 70% 15%, rgba(255,255,255,.12) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 40% 80%, rgba(255,255,255,.1) 0%, transparent 100%),
    radial-gradient(1px 1px at 85% 60%, rgba(255,255,255,.15) 0%, transparent 100%),
    radial-gradient(1px 1px at 25% 55%, rgba(255,255,255,.08) 0%, transparent 100%),
    radial-gradient(2px 2px at 60% 40%, rgba(255,255,255,.06) 0%, transparent 100%);
  pointer-events:none;
}
.hero-text{position:relative;z-index:1;}
.hero-greeting{
  color:#a0a8c0;
  font-size:.95rem;
  font-weight:400;
  margin-bottom:.3rem;
  font-style:italic;
}
.hero-name{
  color:var(--white);
  font-size:2.6rem;
  font-weight:800;
  letter-spacing:.04em;
  text-transform:uppercase;
  line-height:1.1;
  margin-bottom:.5rem;
}
